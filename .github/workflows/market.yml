name: Harga pasar

# Triggered every ~15 minutes by the "Detak 15 menit" heartbeat workflow
# (GitHub's own cron never fired for this repo), on every analysis push by the
# Claude agent, by the cron below as a backup, or manually.
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: ["data/snapshot.json"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      KABAR_TOKEN: ${{ secrets.KABAR_TOKEN }}
      KABAR_VAPID: ${{ secrets.KABAR_VAPID }}
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validasi data agen (batalkan jika rusak)
        if: github.event_name == 'push'
        run: |
          if ! python3 scripts/validate_snapshot.py data/snapshot.json; then
            echo "Data agen tidak valid, kembalikan versi sebelumnya"
            git checkout HEAD~1 -- data/snapshot.json
            echo "REVERTED=1" >> "$GITHUB_ENV"
          fi

      - name: Ambil harga dari Yahoo Finance
        run: python3 scripts/fetch_market.py

      - name: Ambil berita terbaru
        run: python3 scripts/fetch_news.py || true

      - name: Cek akurasi prakiraan
        run: python3 scripts/evaluate_forecasts.py

      - name: Uji historis metode rentang
        run: python3 scripts/backtest.py || true

      - name: Siapkan pengirim Kabar
        if: env.KABAR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: GabFx09/kabar
          path: .kabar

      - name: Pasang pustaka Kabar
        if: env.KABAR_TOKEN != ''
        run: python3 -m pip install --quiet --disable-pip-version-check requests pywebpush

      - name: Peringatan penting (kirim ke aplikasi Kabar)
        run: python3 scripts/alerts.py || true

      - name: Ringkasan pagi (sekali sehari ke Kabar)
        run: python3 scripts/daily_brief.py || true

      - name: Simpan ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/forecasts.json data/headlines.json data/snapshot.json data/alerts.json data/backtest.json
          [ -f data/kabar-state.json ] && git add data/kabar-state.json
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          msg="data: harga & berita $(date -u +%Y-%m-%dT%H:%MZ)"
          [ "${REVERTED:-0}" = "1" ] && msg="data: kembalikan analisis agen yang tidak valid; $msg"
          git commit -m "$msg"
          # Data files are regenerated every run, so on a conflict our fresh copy wins
          # (during a rebase, "theirs" is the commit being replayed, i.e. this run's data).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Hidupkan lagi detak 15 menit bila berhenti
        if: always()
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow detak.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length' || echo 1)
          if [ "$n" = "0" ]; then gh workflow run detak.yml -R "$GITHUB_REPOSITORY" && echo "detak dimulai ulang"; fi
